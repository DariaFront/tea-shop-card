<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Ананасовый улун</title>
  <desc id="desc">Декоративная иллюстрация чаши с чайными листьями и ананасом на случай недоступности фотографии товара</desc>
  <defs>
    <radialGradient id="bg"><stop offset="0" stop-color="#fcfaf6"/><stop offset="1" stop-color="#f0e9dc"/></radialGradient>
    <radialGradient id="bowl"><stop offset="0" stop-color="#536044"/><stop offset=".8" stop-color="#253c2f"/><stop offset="1" stop-color="#182d23"/></radialGradient>
    <linearGradient id="leaves" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#81926a"/><stop offset="1" stop-color="#2d4d32"/></linearGradient>
    <linearGradient id="fruit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4c979"/><stop offset="1" stop-color="#c78b31"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="720" height="720" fill="url(#bg)"/>
  <ellipse cx="362" cy="563" rx="217" ry="52" fill="#594933" opacity=".13" filter="url(#shadow)"/>
  <circle cx="360" cy="340" r="244" fill="#d4c0a4"/>
  <circle cx="360" cy="340" r="224" fill="#f9f4e9"/>
  <circle cx="360" cy="340" r="210" fill="url(#bowl)"/>
  <g fill="url(#leaves)" stroke="#223a27" stroke-width="4" opacity=".98">
    <ellipse cx="240" cy="215" rx="41" ry="19" transform="rotate(42 240 215)"/><ellipse cx="333" cy="192" rx="54" ry="22" transform="rotate(-24 333 192)"/>
    <ellipse cx="434" cy="228" rx="48" ry="19" transform="rotate(32 434 228)"/><ellipse cx="527" cy="302" rx="43" ry="23" transform="rotate(-25 527 302)"/>
    <ellipse cx="469" cy="403" rx="52" ry="20" transform="rotate(69 469 403)"/><ellipse cx="407" cy="501" rx="43" ry="23" transform="rotate(-12 407 501)"/>
    <ellipse cx="295" cy="487" rx="46" ry="20" transform="rotate(-63 295 487)"/><ellipse cx="203" cy="399" rx="47" ry="21" transform="rotate(33 203 399)"/>
    <ellipse cx="185" cy="306" rx="38" ry="19" transform="rotate(-35 185 306)"/><ellipse cx="343" cy="295" rx="50" ry="22" transform="rotate(49 343 295)"/>
    <ellipse cx="289" cy="373" rx="51" ry="21" transform="rotate(-16 289 373)"/><ellipse cx="399" cy="364" rx="50" ry="22" transform="rotate(25 399 364)"/>
    <ellipse cx="349" cy="421" rx="48" ry="20" transform="rotate(-43 349 421)"/><ellipse cx="460" cy="302" rx="44" ry="20" transform="rotate(-32 460 302)"/>
    <ellipse cx="247" cy="286" rx="49" ry="21" transform="rotate(70 247 286)"/><ellipse cx="447" cy="469" rx="34" ry="19" transform="rotate(-62 447 469)"/>
  </g>
  <g fill="url(#fruit)" stroke="#d49f4e" stroke-width="3">
    <rect x="269" y="237" width="46" height="43" rx="8" transform="rotate(-17 269 237)"/>
    <rect x="403" y="271" width="43" height="39" rx="8" transform="rotate(24 403 271)"/>
    <rect x="238" y="422" width="41" height="44" rx="8" transform="rotate(23 238 422)"/>
    <rect x="384" y="425" width="47" height="41" rx="8" transform="rotate(-23 384 425)"/>
    <rect x="322" y="330" width="39" height="41" rx="8" transform="rotate(13 322 330)"/>
  </g>
</svg>
